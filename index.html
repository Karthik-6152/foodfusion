<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFusion - Secure Checkout</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Blue Top Header */
    .top-header { background: #2563eb; color: #fff; text-align: center; padding: 25px 20px; }
    .top-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
    .top-header p { font-size: 0.95rem; opacity: 0.9; }

    /* Center Container */
    .checkout-wrapper { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
    .checkout-card { background: #ffffff; max-width: 480px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); padding: 32px 28px; }
    
    .checkout-card h2 { text-align: center; font-size: 1.6rem; color: #0f172a; margin-bottom: 24px; font-weight: 700; }
    
    /* Product Info Section */
    .item-section { display: flex; gap: 20px; align-items: center; padding-bottom: 24px; border-bottom: 1px solid #e2e8f0; margin-bottom: 24px; }
    .item-img { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
    .item-details h3 { font-size: 1.2rem; color: #0f172a; margin-bottom: 4px; }
    .item-details p { font-size: 0.9rem; color: #64748b; margin-bottom: 10px; }
    .item-price { font-size: 1.4rem; font-weight: 700; color: #2563eb; }
    
    .payment-title { font-size: 0.95rem; font-weight: 600; color: #1e293b; margin-bottom: 16px; }
    #paypal-button-container { width: 100%; min-height: 120px; }
  </style>

  <!-- REPLACE YOUR CLIENT ID HERE -->
  <script src="https://www.paypal.com/sdk/js?client-id=ARjKcSZxVx94Kl55I-W2ma9xsn33Dxdv432Tv_fMcLuvKfpP5r2xd8FL0plzA14jAtlb0bgVEC74wcVT
&currency=USD"></script>
</head>
<body>

  <!-- Top Blue Bar -->
  <div class="top-header">
    <h1>FoodFusion</h1>
    <p>Secure Checkout</p>
  </div>

  <!-- Main Card -->
  <div class="checkout-wrapper">
    <div class="checkout-card">
      <h2>Order Summary</h2>

      <div class="item-section">
        <img class="item-img" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Veg Burger">
        <div class="item-details">
          <h3>Veg Burger</h3>
          <p>FoodFusion Special</p>
          <div class="item-price">₹60 (~$0.75)</div>
        </div>
      </div>

      <div class="payment-title">Choose Payment Method</div>

      <!-- PayPal and Debit/Credit Card Buttons -->
      <div id="paypal-button-container"></div>
    </div>
  </div>

  <script>
    paypal.Buttons({
      style: {
        layout: 'vertical',
        color:  'gold',
        shape:  'rect',
        label:  'paypal'
      },
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            description: "FoodFusion - Veg Burger",
            amount: {
              value: "0.75"
            }
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Order Placed Successfully! Paid by: ' + details.payer.name.given_name);
        });
      },
      onError: function(err) {
        console.error(err);
      }
    }).render('#paypal-button-container');
  </script>

</body>
</html>
